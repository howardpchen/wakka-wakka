name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package metadata
        run: python -m json.tool package.json >/dev/null

      - name: Validate maze topology
        run: python scripts/validate-maze.py

      - name: Validate preserved release artifact
        run: python scripts/validate-release.py
